# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=3.0.0
group=com.chillpavz.oredetectorreborn
java_version=25

# Common
minecraft_version=26.2
mod_name=Ore Detector Reborn
mod_author=chillpavz
mod_id=ore_detector_reborn
license=LicenseRef-PolyForm-Shield-1.0.0
credits=Inspired by the original Ore Detector by restonic4, MIT licensed. See NOTICE for what still derives from it.
description=Attune one detector to an ore, then right-click a surface to scan for it. \nRuns on Attunement Liquid brewed from ore dust in a Resonance Chamber, built from Trial Chamber materials.

## Maven bracket range, used by the NeoForge toml. Fabric cannot parse brackets, so the same range
## is duplicated below in Fabric semver. Both must be kept in step.
minecraft_version_range=[26.2, 26.3)
fabric_minecraft_version_range=>=26.2 <26.3
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.152.1+26.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.1-beta
## Accepted NeoForge builds. Must NOT be "[neoforge_version,)" - that pins to the exact build we
## compiled against, refusing every earlier build of the same MC version.
neoforge_version_range=[26.2,26.3)
neoforge_loader_version_range=[4,)

# Config (cloth-config; Mod Menu for the Fabric config button)
cloth_config_version=26.2.155
modmenu_version=20.0.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
